name: Deploy Rozbirka Web

on:
  pull_request:
    branches:
      - develop
      - main
    # Everything except prose can change the build, lint or tests (index.html,
    # eslint/prettier/npm config, types), so list what may be skipped instead
    # of what must run.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - qa
          - prod
      enable_deployment:
        description: Deploy after building
        required: true
        type: boolean
        default: true
      skip_e2e:
        description: Skip browser E2E and authenticated smoke tests
        required: false
        type: boolean
        default: false

# A new commit supersedes a pull request's checks, so those are cancelled. A
# push or manual run may be deploying: it is never cancelled, and later runs on
# the same branch queue behind it (GitHub keeps only the newest one waiting).
concurrency:
  group: rozbirka-web-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-deploy:
    name: Build & Deploy Rozbirka Web
    uses: ./.github/workflows/deploy-node-static-template.yml
    permissions:
      contents: read
      id-token: write
    secrets:
      CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
      GCP_CONTRACT_READER_SERVICE_ACCOUNT: ${{ secrets.GCP_CONTRACT_READER_SERVICE_ACCOUNT }}
    with:
      project_name: Rozbirka Web
      branch: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }}
      environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'qa' }}
      enable_deployment: ${{ (github.event_name == 'push' && github.ref_name == 'develop') || (github.event_name == 'workflow_dispatch' && inputs.enable_deployment) }}
      auto_qa_deploy: ${{ github.event_name == 'push' && github.ref_name == 'develop' }}
      run_build: true
      skip_e2e: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_e2e }}
