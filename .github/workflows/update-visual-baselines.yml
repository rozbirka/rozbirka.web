name: Update Visual Baselines

# CI compares landing screenshots against the committed `*-linux-chromium.png`
# baselines but never rewrites them. Run this after an intended visual change:
# it captures fresh Linux baselines in the same Playwright container image the
# E2E gate uses and uploads them as an artifact to review and commit. It does
# not push anything. macOS baselines (without `-linux`) serve
# local runs on a Mac and are refreshed there.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Which screenshots to rewrite
        required: true
        type: choice
        default: changed
        options:
          - changed
          - all

concurrency:
  group: rozbirka-web-visual-baselines-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  landing:
    name: Landing baselines (Linux Chromium)
    runs-on: ubuntu-latest
    # Keep the image identical to the E2E job in deploy-node-static-template.yml:
    # the baselines are only valid for the fonts and Chromium build it ships.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm install --global npm@11.16.0

      - run: npm ci

      - name: Capture landing baselines
        run: npx playwright test e2e/landing.spec.ts --project=chromium --update-snapshots=${{ inputs.mode }}

      # Uploaded even when another landing test fails: the job stays red, but
      # the captured baselines are still there to inspect.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-linux-baselines
          path: e2e/**/*-snapshots/*-linux-*.png
          if-no-files-found: error
