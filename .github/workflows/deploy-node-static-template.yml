name: Deploy Node Static Template

on:
  workflow_call:
    inputs:
      project_name:
        description: Display name for the app being deployed
        required: true
        type: string
      branch:
        description: Branch to build
        required: true
        type: string
      environment:
        description: Target environment
        required: true
        type: string
      enable_deployment:
        description: Deploy after building
        required: true
        type: boolean
      auto_qa_deploy:
        description: True when this was triggered by develop push
        required: true
        type: boolean
      run_build:
        description: Run npm build before deployment
        required: true
        type: boolean
      release_run_id:
        description: Existing verified release run; skips all build and test jobs
        required: false
        type: string
        default: ''
      skip_e2e:
        description: Skip browser E2E and authenticated smoke tests
        required: false
        type: boolean
        default: false
    secrets:
      CLOUDFLARE_TOKEN:
        description: Cloudflare API token with Workers deploy permissions
        required: true
      CF_ACCESS_CLIENT_ID:
        description: Cloudflare Access service-token client ID for QA checks
        required: false
      CF_ACCESS_CLIENT_SECRET:
        description: Cloudflare Access service-token secret for QA checks
        required: false
      GCP_WIF_PROVIDER:
        description: GCP Workload Identity provider for private contract access
        required: true
      GCP_CONTRACT_READER_SERVICE_ACCOUNT:
        description: Read-only GCP service account for private OpenAPI contracts
        required: true

env:
  NODE_VERSION: '22'

jobs:
  request:
    name: Validate release request
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require an existing release for manual deployment
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ENABLE_DEPLOYMENT: ${{ inputs.enable_deployment }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          TARGET_ENVIRONMENT: ${{ inputs.auto_qa_deploy && 'qa' || inputs.environment }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$ENABLE_DEPLOYMENT" = "true" ] && [ -z "$RELEASE_RUN_ID" ]; then
            echo "::error::Manual deployment requires release_run_id. Prepare with enable_deployment=false, then deploy that verified release."
            exit 1
          fi
          if [ -n "$RELEASE_RUN_ID" ] && ! [[ "$RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::release_run_id must be a positive workflow run ID."
            exit 1
          fi
          if [ "$TARGET_ENVIRONMENT" != "qa" ] && [ "$TARGET_ENVIRONMENT" != "prod" ]; then
            echo "::error::Only qa and prod are valid release environments."
            exit 1
          fi
          if [ "$TARGET_ENVIRONMENT" = "prod" ] && [ "$SOURCE_BRANCH" != "main" ]; then
            echo "::error::Production releases require main."
            exit 1
          fi

  quality:
    needs: [request]
    if: ${{ !inputs.release_run_id }}
    name: Quality ${{ inputs.project_name }} (${{ matrix.gate }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # The gates are independent, so each gets its own runner; the unit suite,
    # the longest of them, is split into two vitest shards.
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: static
          - gate: unit 1/2
            shard: 1/2
          - gate: unit 2/2
            shard: 2/2
          - gate: contracts

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && inputs.branch || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm install --global npm@11.16.0

      - run: npm ci

      - if: inputs.run_build && matrix.gate == 'static'
        name: Lint, typecheck, parity, and dependency gates
        run: npm run check:static

      - if: inputs.run_build && matrix.shard
        name: Unit test gate (shard ${{ matrix.shard }})
        run: npm run test:unit -- --shard=${{ matrix.shard }}

      - if: inputs.run_build && matrix.gate == 'contracts'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CONTRACT_READER_SERVICE_ACCOUNT }}

      - if: inputs.run_build && matrix.gate == 'contracts'
        uses: google-github-actions/setup-gcloud@v2

      - if: inputs.run_build && matrix.gate == 'contracts'
        name: Contract tooling and API adapter gate
        run: npm run test:contracts

      - if: inputs.run_build && matrix.gate == 'contracts'
        name: Immutable Core contract drift gate
        shell: bash
        run: |
          set -euo pipefail
          contract_dir="$RUNNER_TEMP/openapi-contracts"
          paths_json="$(node scripts/fetch-api-contracts.mjs \
            --manifest contracts/openapi-sources.json \
            --out "$contract_dir")"
          core_path="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.core)' "$paths_json")"
          npm run contracts:check -- --core "$core_path"

      - if: inputs.run_build && matrix.gate == 'contracts'
        name: Auth and tenant integration gate
        run: npm run test:integration

  e2e:
    needs: [request]
    if: ${{ !inputs.release_run_id && !inputs.skip_e2e }}
    name: Browser E2E ${{ inputs.project_name }} (${{ matrix.project }})
    runs-on: ubuntu-latest
    # Every project runs in the Playwright image: it ships the browsers and
    # their system packages, so no job waits on apt mirrors (installing them on
    # the bare runner took 0.5 to 15 minutes). The Linux visual baselines are
    # captured in the same image by update-visual-baselines.yml. Match the image
    # version to @playwright/test in package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    # Includes the image pull, application build and browser suite.
    timeout-minutes: 25
    permissions:
      contents: read
    # The e2e stub server keeps global state, so a run stays on a single worker;
    # parallelism comes from giving each browser project its own runner. One
    # project also keeps each browser result independently visible.
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: android
            browser: chromium
          - project: ios
            browser: webkit

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && inputs.branch || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm install --global npm@11.16.0

      - run: npm ci

      - if: inputs.run_build
        name: Verify installed ${{ matrix.browser }}
        env:
          BROWSER_ENGINE: ${{ matrix.browser }}
        run: |
          # GitHub mounts this directory with the runner's UID. Firefox requires
          # its owner to match the container user; keep the existing HOME path.
          chown "$(id -u):$(id -g)" "$HOME"
          node <<'NODE'
          const fs = require('node:fs');
          const browser = require('@playwright/test')[process.env.BROWSER_ENGINE];
          fs.accessSync(browser.executablePath(), fs.constants.X_OK);
          console.log(`Playwright ${require('@playwright/test/package.json').version}: ${browser.executablePath()}`);
          browser.launch().then(instance => instance.close()).catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - if: inputs.run_build
        name: Browser E2E gate
        run: npm run test:e2e -- --project=${{ matrix.project }}

      - if: inputs.run_build && matrix.project == 'chromium'
        name: Authenticated Chromium smoke gate
        run: npm run test:smoke

      - if: failure() && inputs.run_build
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ matrix.project }}
          path: |
            test-results
            e2e/**/*-snapshots/*-linux-*.png
          if-no-files-found: warn

  build:
    needs: [quality, e2e]
    # Only the complete quality/browser gate can seal a deployable release.
    if: ${{ !cancelled() && !inputs.release_run_id && inputs.run_build && needs.quality.result == 'success' && needs.e2e.result == 'success' }}
    name: Seal verified Web release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && inputs.branch || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm install --global npm@11.16.0

      - run: npm ci

      - if: inputs.run_build
        run: |
          env_name="${{ inputs.auto_qa_deploy && 'qa' || inputs.environment }}"
          if [ "$env_name" = "prod" ]; then
            npm run verify:release:prod
          else
            npm run verify:release:qa
          fi

      - if: github.event_name != 'pull_request'
        name: Seal static assets, compiled Worker and runtime config
        run: node scripts/web-release.mjs seal
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
          RELEASE_ENVIRONMENT: ${{ inputs.auto_qa_deploy && 'qa' || inputs.environment }}

      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: web-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: .web-release
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [request, quality, e2e, build]
    if: ${{ !cancelled() && needs.request.result == 'success' && github.event_name != 'pull_request' && (inputs.release_run_id || needs.build.result == 'success') }}
    name: Resolve verified Web release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      run_id: ${{ steps.release.outputs.run_id }}
      attempt: ${{ steps.release.outputs.attempt }}
      artifact_id: ${{ steps.release.outputs.artifact_id }}
      digest: ${{ steps.release.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify source run, successful producer/gates and artifact binding
        id: release
        run: node scripts/web-release.mjs resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          RELEASE_ENVIRONMENT: ${{ inputs.auto_qa_deploy && 'qa' || inputs.environment }}

  deploy:
    needs: [release]
    if: ${{ !cancelled() && needs.release.result == 'success' && inputs.enable_deployment && (inputs.environment != 'prod' || github.ref == 'refs/heads/main') }}
    name: Deploy ${{ inputs.project_name }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.auto_qa_deploy && 'qa' || inputs.environment }}
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_SHA: ${{ needs.release.outputs.sha }}
      RELEASE_RUN_ID: ${{ needs.release.outputs.run_id }}
      RELEASE_ATTEMPT: ${{ needs.release.outputs.attempt }}
      RELEASE_ARTIFACT_ID: ${{ needs.release.outputs.artifact_id }}
      RELEASE_DIGEST: ${{ needs.release.outputs.digest }}
      RELEASE_BRANCH: ${{ github.ref_name }}
      RELEASE_ENVIRONMENT: ${{ inputs.auto_qa_deploy && 'qa' || inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm install --global npm@11.16.0
      - run: npm ci --ignore-scripts

      - name: Download exact artifact and enforce archive digest
        run: node scripts/web-release.mjs fetch
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify sealed package contents and provenance
        run: node scripts/web-release.mjs verify

      - name: Deploy verified prebundled Worker and assets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN GitHub secret is missing or empty."
            exit 1
          fi

          cd .web-release
          if [ "$RELEASE_ENVIRONMENT" = "prod" ]; then
            node ../scripts/check-deploy-artifact.mjs production
            node ../scripts/check-production-routes.mjs https://rozbirka.pro https://api.rozbirka.pro
          else
            node ../scripts/check-deploy-artifact.mjs qa
          fi

          ../node_modules/.bin/wrangler deploy --config wrangler.json --no-bundle

          if [ "$RELEASE_ENVIRONMENT" = "prod" ]; then
            node ../scripts/check-production-routes.mjs https://rozbirka.pro https://api.rozbirka.pro
          else
            node ../scripts/check-production-routes.mjs https://qa.rozbirka.pro https://qaapi.rozbirka.pro
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
