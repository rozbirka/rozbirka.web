<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<nav class="rz-sidebar" aria-label="Навігація кабінету">
  <button class="rz-sidebar__tenant" type="button" aria-label="Перемкнути розбірку"><span class="rz-avatar">Р</span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Демо-розбірка</span><i class="icon-chevrons-up-down rz-dim" style="font-size:14px"></i></button>
  <button class="rz-search" type="button" style="margin:4px 0 8px;cursor:pointer;color:var(--rz-text-dim)"><i class="icon-search"></i><span style="flex:1;text-align:left">Пошук</span><span class="rz-kbd">⌘K</span></button>
  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="5">
    <div class="{{ g.cls }}">
      <sc-if value="{{ g.title }}" hint-placeholder-val="{{ true }}"><p class="rz-nav-group__title">{{ g.title }}</p></sc-if>
      <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="3">
        <a class="rz-nav-item" href="{{ it.href }}" aria-current="{{ it.current }}"><i class="{{ it.icon }}"></i>{{ it.label }}</a>
      </sc-for>
    </div>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;dashboard&quot;, &quot;cars&quot;, &quot;parts&quot;, &quot;inventory&quot;, &quot;intakes&quot;, &quot;stickers&quot;, &quot;orders&quot;, &quot;customers&quot;, &quot;cash&quot;, &quot;reports&quot;, &quot;team&quot;, &quot;billing&quot;, &quot;integrations&quot;, &quot;business&quot;, &quot;profile&quot;], &quot;default&quot;: &quot;parts&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;hidden&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;string[]&quot;}}">
const GROUPS = [
  { title: null, items: [['dashboard', 'Головна', 'icon-layout-dashboard', 'Record.dc.html?screen=dashboard']] },
  { title: 'Склад', items: [['cars', 'Автомобілі', 'icon-car', 'List.dc.html?screen=cars'], ['parts', 'Запчастини', 'icon-package', 'Parts List.dc.html'], ['inventory', 'Інвентаризація', 'icon-clipboard-check', 'List.dc.html?screen=inventory'], ['intakes', 'Приймання', 'icon-scan-line', 'List.dc.html?screen=intakes'], ['stickers', 'Стікери', 'icon-sticker', '../components/Print.dc.html']] },
  { title: 'Продажі', items: [['orders', 'Замовлення', 'icon-clipboard-list', 'List.dc.html?screen=orders'], ['customers', 'Клієнти', 'icon-users', 'List.dc.html?screen=customers']] },
  { title: 'Гроші', items: [['cash', 'Фінанси', 'icon-wallet-cards', 'List.dc.html?screen=cash'], ['reports', 'Звіти', 'icon-chart-column', 'Record.dc.html?screen=reports']] },
  { title: 'Налаштування', bottom: true, items: [['team', 'Команда', 'icon-user-round-cog', 'List.dc.html?screen=team'], ['billing', 'Підписка', 'icon-credit-card', 'Record.dc.html?screen=subscription'], ['integrations', 'Інтеграції', 'icon-plug', 'Record.dc.html?screen=integrations'], ['business', 'Бізнес', 'icon-building-2', 'Record.dc.html?screen=business'], ['profile', 'Профіль', 'icon-user-round', 'Record.dc.html?screen=profile']] },
];
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'parts';
    const hidden = new Set(this.props.hidden ?? []);
    return {
      groups: GROUPS.map((g) => ({ title: g.title, cls: g.bottom ? 'rz-nav-group rz-sidebar__bottom' : 'rz-nav-group', items: g.items.filter(([k]) => !hidden.has(k)).map(([k, label, icon, href]) => ({ label, icon, href: './' + href, current: k === active ? 'page' : 'false' })) })),
    };
  }
}
</script>
</body>
</html>
