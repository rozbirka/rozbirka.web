<x-dc>
<helmet>

<style>html,body{margin:0}body{background:#0b0b0b}*{box-sizing:border-box}a{color:#f77425;text-decoration:none}a:hover{color:#ff8430}</style>
</helmet>
<div data-theme="dark" style="min-height:100vh;background:var(--rz-bg);color:var(--rz-text);font-family:var(--rz-font);font-size:var(--rz-fs-body);line-height:var(--rz-lh);padding:40px 24px 64px">
  <div style="max-width:880px;margin:0 auto;display:grid;gap:28px">
    <header style="display:grid;gap:8px">
      <p style="margin:0;font-family:var(--rz-font-mono);font-size:var(--rz-fs-micro);letter-spacing:var(--rz-ls-mono);text-transform:uppercase;color:var(--rz-text-dim)">Rozbirka Design System · v2</p>
      <h1 style="margin:0;font-size:var(--rz-fs-page);font-weight:700;letter-spacing:var(--rz-ls-title);color:var(--rz-text-strong)">Зміст</h1>
      <p style="margin:0;color:var(--rz-text-muted)">Фаза B — компоненти. Фаза C — фічі (кожна сторінка окремо, з усіма станами).</p>
    </header>
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
      <section style="display:grid;gap:8px">
        <div style="display:flex;align-items:baseline;gap:10px"><h2 style="margin:0;font-size:var(--rz-fs-title);font-weight:700;color:var(--rz-text-strong)">{{ g.title }}</h2><span style="font-family:var(--rz-font-mono);font-size:var(--rz-fs-caption);color:{{ g.statusColor }}">{{ g.status }}</span></div>
        <div style="border:1px solid var(--rz-border);border-radius:var(--rz-r-md);background:var(--rz-surface);overflow:hidden">
          <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="3">
            <div style="display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:16px;padding:9px 12px;border-top:1px solid var(--rz-border)">
              <sc-if value="{{ it.href }}" hint-placeholder-val="{{ true }}"><a href="{{ it.href }}" style="font-weight:500">{{ it.name }}</a></sc-if>
              <sc-if value="{{ it.todo }}" hint-placeholder-val="{{ false }}"><span style="color:var(--rz-text-dim)">{{ it.name }}</span></sc-if>
              <span style="color:var(--rz-text-muted)">{{ it.note }}</span>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>
</div>
</x-dc>
