<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../kit.css">
<link rel="stylesheet" href="https://unpkg.com/lucide-static@0.460.0/font/lucide.css">
<meta name="design_doc_mode" content="canvas">
<style>html,body{margin:0}</style>
</helmet>
<div class="rz" data-theme="dark" style="min-height:100vh;padding:24px">
  <header style="display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:20px">
    <h1 class="rz-h-page">{{ heading }}</h1>
    <span class="rz-caption">{{ sub }}</span>
    <div class="rz-seg" role="radiogroup" aria-label="Фіча" style="margin-left:auto"><sc-for list="{{ featureTabs }}" as="f" hint-placeholder-count="3"><button type="button" role="radio" aria-checked="{{ f.checked }}" onClick="{{ f.onClick }}">{{ f.label }}</button></sc-for></div>
  </header>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:20px">
    <sc-for list="{{ cells }}" as="c" hint-placeholder-count="8">
      <figure style="margin:0;display:grid;gap:8px">
        <div style="position:relative;width:432px;height:270px;border:1px solid var(--rz-border-strong);border-radius:var(--rz-r-md);overflow:hidden;background:var(--rz-bg)">
          <iframe title="{{ c.label }}" src="{{ c.src }}" loading="lazy" style="position:absolute;left:0;top:0;width:1440px;height:900px;border:0;transform:scale(0.3);transform-origin:0 0;pointer-events:none"></iframe>
        </div>
        <figcaption style="display:flex;gap:8px;align-items:baseline"><span class="rz-mono rz-dim" style="font-size:var(--rz-fs-micro)">{{ c.id }}</span><a href="{{ c.src }}" class="rz-strong" style="font-weight:600">{{ c.label }}</a></figcaption>
      </figure>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { manifest: null, file: null };
  componentDidMount() {
    let f = null; try { f = new URLSearchParams(location.search).get('f'); } catch (e) {}
    fetch('./manifest.json').then((r) => r.json()).then((m) => this.setState({ manifest: m, file: f || (m.features[0] && m.features[0].file) })).catch(() => {});
  }
  renderVals() {
    const m = this.state.manifest;
    const feats = m ? m.features : [];
    const ft = feats.find((x) => x.file === this.state.file) || feats[0];
    return {
      heading: ft ? `${ft.id} · ${ft.title}` : 'Усі стани',
      sub: ft ? `${ft.route} · ${ft.states.length} станів` : '',
      featureTabs: feats.map((x) => ({ label: x.id, checked: ft && x.file === ft.file ? 'true' : 'false', onClick: () => this.setState({ file: x.file }) })),
      cells: ft ? ft.states.map(([id, label]) => ({ id, label, src: './' + encodeURI(ft.file) + (ft.file.includes('?') ? '&' : '?') + 'state=' + id })) : [],
    };
  }
}
</script>
</body>
</html>
