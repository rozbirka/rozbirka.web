      - rozbirka.mobile:src/api/auth.ts
      - rozbirka.identity:src/Rozbirka.Identity.API/Controllers/AuthController.cs

  - id: auth.invitation.preview
    domain: auth
    name: Preview an invitation before accepting it
    mobile:
      routes:
        - /(auth)/invite/[code]
      actions:
        - Load invitation tenant, role, inviter, expiry, and validity
        - Continue to login when anonymous
    web:
      outcome: Open a stable invitation URL and preview safe invitation information before authentication or acceptance
      route: /invite/:code
      disposition: parity
    contract:
      service: core
      status: partial
      operations:
        - GET /api/v1/invitations/{code}/info
      notes: Anonymous runtime endpoint exists, but the immutable Core contract is pending under ROZ-121
    access:
      permissions:
        - anonymous
      tenant: not-applicable
      billing: not-applicable
    owner: web
    tracking:
      status: existing
      issue: ROZ-104
    evidence:
