      - rozbirka.core:src/Rozbirka.API/Controllers/MediaController.cs

  - id: team.permission-enforcement
    domain: team
    name: Enforce permissions on navigation, data, and mutations
    trigger: A user enters a protected feature or attempts an operation
    mobileBehavior: Load server permissions and features, hide unavailable actions, and rely on server authorization as the final authority
    webOutcome: Gate routes and controls for clarity while requiring the API to enforce every read and mutation permission independently
    contract:
      service: core
      status: partial
      operations:
        - GET /api/v1/me/permissions
