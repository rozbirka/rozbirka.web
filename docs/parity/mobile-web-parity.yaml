        - /(auth)/onboarding
      actions:
        - Enter or resume an invitation code
        - Accept the invitation
        - Transition into the accepted tenant
    web:
      outcome: Accept an invitation only after authentication and transition into the new tenant without stale tenant data
      route: /invite/:code
      disposition: parity
    contract:
      service: core
      status: partial
      operations:
        - POST /api/v1/invitations/accept
      notes: User-scoped acceptance exists, but the immutable Core contract and tenant-transition integration evidence are pending under ROZ-121 and ROZ-122
    access:
      permissions:
        - authenticated
      tenant: invitation-target
      billing: not-applicable
    owner: core
    tracking:
      status: existing
      issue: ROZ-122
    evidence:
      - rozbirka.mobile:app/(auth)/invite/[code].tsx
      - rozbirka.mobile:app/(auth)/onboarding.tsx
      - rozbirka.mobile:src/api/invites.ts
      - rozbirka.mobile:src/session/tenantTransition.ts
      - rozbirka.core:src/Rozbirka.API/Controllers/InvitationsController.cs

