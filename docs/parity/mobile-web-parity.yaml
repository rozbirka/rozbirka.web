  - id: parts.media-ownership
    domain: parts
    name: Enforce private media ownership and cleanup
    trigger: A part or vehicle image is uploaded, viewed, replaced, or deleted
    mobileBehavior: Upload and delete media through authenticated endpoints and clear local private artifacts at session boundaries
    webOutcome: Treat storage keys as opaque, require server authorization for every media operation, and clean abandoned uploads without exposing cross-tenant objects
    contract:
      service: core
      status: unsafe
      operations:
        - POST /api/v1/media/upload
        - DELETE /api/v1/media
      notes: Runtime endpoints validate file type and size, but visible controller evidence does not bind storage-key deletion or upload targets to an authorized tenant entity; remediation is tracked by ROZ-122
    access:
      permissions:
        - entity-specific-manage-permission
      tenant: required-and-server-enforced
      billing: media-limits
    owner: core
    tracking:
      status: existing
      issue: ROZ-122
    evidence:
