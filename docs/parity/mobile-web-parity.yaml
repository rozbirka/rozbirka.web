  - id: inventory.count.mobile-only
    domain: inventory
    name: Physically count a zone with QR scanning and an exclusive lease
    trigger: A worker starts physically counting an inventory zone
    mobileBehavior: Scan the zone, acquire and heartbeat its exclusive lease, scan parts with an offline queue, undo the latest scan, and complete the zone
    webOutcome: Show count progress and the resulting scan journal without camera, scan, lease, undo, offline-queue, or zone-completion controls
    contract:
      service: core
      status: ready
      operations:
        - GET /api/v1/inventory/sessions/{id}
        - GET /api/v1/inventory/sessions/{sessionId}/zones/{zoneId}/scans
      notes: Web intentionally consumes only read operations; scan mutation, lease, offline queue, undo, and zone completion remain Mobile-only
